
upstream django {
    server api:8000;
    keepalive 32;
}

# HTTP: allow Let's Encrypt challenges, redirect everything else.
server {
    listen 80;
    server_name api.abhaydev.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name api.abhaydev.site;

    ssl_certificate /etc/letsencrypt/live/api.abhaydev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.abhaydev.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 160M;

    location / {
        proxy_pass http://django;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
