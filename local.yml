services:
  api: &django
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    volumes:
      - ./backend:/app/backend
    expose:
      - "8000"
    env_file:
      - ./.envs/.env.local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: /start.sh
    networks:
      - quickshare_local_nw

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - quickshare_local_db:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickshare_local_nw

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/local/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - quickshare_local_nw

  rabbitmq:
    image: rabbitmq:4-management
    container_name: quickshare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./.envs/.env.local
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - quickshare_local_nw

  celeryworker:
    <<: *django
    expose: []
    volumes:
      - ./backend:/app/backend
      - quickshare_scan_tmp:/var/quickshare/scans
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    command: celery -A config worker --loglevel=info

  celerybeat:
    <<: *django
    expose: []
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    command: celery -A config beat --loglevel=info

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    expose:
      - "3310"
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "1"

      CLAMD_CONF_TCPSocket: "3310"
      CLAMD_CONF_TCPAddr: "0.0.0.0"
      CLAMD_CONF_MaxFileSize: "160M"
      CLAMD_CONF_MaxScanSize: "300M"

    volumes:
      - clamav_db:/var/lib/clamav
      - quickshare_scan_tmp:/var/quickshare/scans
    networks:
      - quickshare_local_nw

networks:
  quickshare_local_nw:
    driver: bridge

volumes:
  quickshare_local_db:
  rabbitmq_data:
  clamav_db:
  quickshare_scan_tmp: